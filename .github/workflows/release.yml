name: Programme bauen

# Baut aus demselben Quellstand je eine eigenstaendige Datei fuer macOS
# (Apple Silicon und Intel) sowie Windows. Laeuft bei jedem Push auf main,
# auf Zuruf, und legt bei einem Versions-Tag zusaetzlich ein Release an.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    name: ${{ matrix.bezeichnung }}
    runs-on: ${{ matrix.laufer }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - laufer: macos-14
            bezeichnung: macOS (Apple Silicon)
            kennung: macos-arm64
            pruefpfad: dist/SZUntisPDF.app/Contents/MacOS/SZUntisPDF
          # macos-13 ist abgeschaltet: Jobs mit diesem Label starten nie.
          - laufer: macos-15-intel
            bezeichnung: macOS (Intel)
            kennung: macos-intel
            pruefpfad: dist/SZUntisPDF.app/Contents/MacOS/SZUntisPDF
          - laufer: windows-latest
            bezeichnung: Windows
            kennung: windows-x64
            pruefpfad: dist/SZUntisPDF.exe

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # Tags werden für die Versionsnummer gebraucht

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Werkzeuge installieren
        # certifi wird mitgepackt, sonst fehlt dem Programm der Zertifikatsspeicher.
        run: python -m pip install --upgrade pip pyinstaller certifi

      - name: Bauen
        env:
          SZUNTIS_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: pyinstaller --noconfirm --clean SZUntisPDF.spec

      - name: Kurztest (startet und antwortet?)
        shell: bash
        run: python werkzeuge/rauchtest.py "${{ matrix.pruefpfad }}" --tls

      - name: Paket schnüren
        shell: bash
        # macOS: ditto statt zip, sonst verliert das .app-Buendel das
        # Ausfuehrungsrecht und laesst sich beim Empfaenger nicht starten.
        # Windows: shutil, weil zip auf den Laeufern nicht verlaesslich da ist.
        run: |
          mkdir -p paket
          cp ANLEITUNG.md paket/
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R dist/SZUntisPDF.app paket/
            ditto -c -k --sequesterRsrc --keepParent paket "SZUntisPDF-${{ matrix.kennung }}.zip"
          else
            cp dist/SZUntisPDF.exe paket/
            python -c "import shutil; shutil.make_archive('SZUntisPDF-${{ matrix.kennung }}', 'zip', 'paket')"
          fi
          ls -l "SZUntisPDF-${{ matrix.kennung }}.zip" | awk '{printf "Paket: %.1f MB\n", $5/1048576}'

      - uses: actions/upload-artifact@v4
        with:
          name: SZUntisPDF-${{ matrix.kennung }}
          path: SZUntisPDF-${{ matrix.kennung }}.zip
          retention-days: 90

      - name: Release bestücken
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SZUntisPDF-${{ matrix.kennung }}.zip
          generate_release_notes: true

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # Tags werden für die Versionsnummer gebraucht

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android-SDK bereitstellen
        # Der Ubuntu-Läufer bringt das SDK mit; die Aktion
        # android-actions/setup-android scheitert am längst entfernten
        # Paket "tools". Also direkt der mitgelieferte sdkmanager.
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          CLI=$(ls -d "$SDK"/cmdline-tools/*/bin | sort -V | tail -1)
          yes | "$CLI/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$CLI/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          ls "$SDK/platforms"

      - name: Signaturschlüssel bereitstellen
        # Nur wenn die Secrets hinterlegt sind. Fehlen sie, signiert Gradle mit
        # dem Debug-Schlüssel - die APK laesst sich dann installieren, aber
        # nicht ueber eine aeltere Fassung druebersetzen.
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/schluessel.jks
            echo "Eigener Schlüssel wird verwendet."
          else
            echo "::warning::Kein ANDROID_KEYSTORE_BASE64 hinterlegt - Debug-Signatur."
          fi

      - name: Bauen
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORT: ${{ secrets.ANDROID_KEYSTORE_PASSWORT }}
          ANDROID_SCHLUESSEL_ALIAS: ${{ secrets.ANDROID_SCHLUESSEL_ALIAS }}
          SZUNTIS_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Prüfen und benennen
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK" | awk '{printf "APK: %.2f MB\n", $5/1048576}'
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -4
          cp "$APK" SZUntisPDF-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SZUntisPDF-android
          path: SZUntisPDF-android.apk
          retention-days: 90

      - name: Release bestücken
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SZUntisPDF-android.apk
          generate_release_notes: true
